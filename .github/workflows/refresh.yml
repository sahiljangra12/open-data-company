name: Refresh datasets

on:
  schedule:
    - cron: "23 5 * * *"   # every day, 05:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/build_datasets.py     # datasets, latest values, change log
        env:                                       # free keys for the sources that ask for one; a missing key only skips its loader
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - run: python scripts/build_catalog.py
      - run: python scripts/build_scorecard.py
      - run: python scripts/build_site.py         # dataset list page, sitemap, plain-text index
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/*.html docs/llms.txt docs/sitemap.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh datasets"
          git pull --rebase origin main
          git push
