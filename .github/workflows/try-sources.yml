name: Try data sources

# Run by hand. Builds chosen datasets into a scratch folder on GitHub's servers and prints what came back.
# Nothing is saved or published: this is for checking a new source before it joins the daily refresh.
# With "full" set to yes on a branch other than main, it runs the whole refresh and saves the result to that branch,
# so the site can be checked against real data before the branch is merged.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Builder names to try, comma separated"
        required: false
        type: string
      probe:
        description: "Our World in Data chart names to look up, comma separated"
        required: false
        type: string
      full:
        description: "yes = run the whole refresh and save it to this branch (never main)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - name: Which keys are saved (names only, never values)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | jq -r 'keys[]' | grep -v -i '^github_token$' | sed 's/^/saved secret: /' || echo "no repository secrets are saved"
      - name: Try
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          ONLY: ${{ inputs.only }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "urls" ]; then python scripts/build_datasets.py --probe-urls; elif [ -n "$PROBE" ]; then python scripts/build_datasets.py --probe-owid "$PROBE"; fi
          if [ -n "$ONLY" ]; then python scripts/build_datasets.py --try --only "$ONLY"; fi
      - name: Whole refresh, saved to this branch
        if: inputs.full == 'yes' && github.ref_name != 'main'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/build_datasets.py
          python scripts/build_catalog.py
          python scripts/build_scorecard.py
          python scripts/build_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/*.html docs/llms.txt docs/sitemap.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -q -m "Refresh datasets (branch rehearsal)"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q
