name: Check statistics and file readers

on:
  push:
    branches: [main]
    paths: ["docs/assets/stats.js", "docs/assets/readers.js", "docs/vendor/**", "tests/**", ".github/workflows/check-stats.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install numpy scipy statsmodels pymannkendall pandas openpyxl pyarrow pyreadstat
      - run: python tests/check_stats.py       # the statistics against scipy and statsmodels
      - run: python tests/check_readers.py     # every file format against pandas, pyarrow and pyreadstat
